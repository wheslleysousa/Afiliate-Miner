name: Empacotar Afiliate Miner
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  zip-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validar arquivos da extensão
        shell: bash
        run: |
          test -s manifest.json
          test -s background.js
          test -s content.js
          test -s popup.html
          test -s popup.css
          test -s popup.js
          python3 -m json.tool manifest.json > /dev/null
      - name: Criar ZIP instalável (arquivos na raiz)
        shell: bash
        run: |
          zip -q -r Afiliate-Miner-2.6.2.zip manifest.json background.js content.js popup.html popup.css popup.js icons/
          unzip -t Afiliate-Miner-2.6.2.zip | tail -1
      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v4
        with:
          name: Afiliate-Miner-2.6.2
          path: Afiliate-Miner-2.6.2.zip
          if-no-files-found: error
          retention-days: 30
